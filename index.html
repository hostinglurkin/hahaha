<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ComLife</title>
<meta name="theme-color" content="#07070d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
@property --p{syntax:'<number>';inherits:false;initial-value:80}
:root{
  --bg:#07070d; --bg2:#0d0e1a; --glass:rgba(18,20,38,.78); --glass2:rgba(32,35,62,.85);
  --fg:#eef0ff; --muted:#8f93b8; --line:rgba(140,150,255,.17);
  --accent:#7c6cff; --accent2:#22d3ee; --pink:#ff4fa3;
  --good:#34d399; --bad:#fb5a6e; --heat:#ff7a45; --gold:#fbbf24;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(1100px 600px at 15% -10%,#1d1658 0%,transparent 60%),radial-gradient(900px 500px at 105% 110%,#0b3d4d 0%,transparent 55%),var(--bg);
  color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;color-scheme:dark;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .8s;box-shadow:inset 0 0 140px 30px rgba(255,60,50,.55)}
#vig.pulse{animation:vig 1.4s ease-in-out infinite}
@keyframes vig{50%{filter:brightness(1.6)}}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:80}
#flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.45}100%{opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}

#app{position:relative;z-index:2;height:100vh;height:100dvh;max-width:640px;margin:0 auto;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(12,13,26,.80),rgba(8,9,18,.90));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-inline:1px solid var(--line);box-shadow:0 0 90px rgba(124,108,255,.16);transition:filter .8s}
body.jail #app{filter:grayscale(.65) contrast(1.05)}
body.shake #app{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

.top{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1;margin-right:auto}
.brand b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{font-family:var(--f-mono);font-weight:500;font-size:10px;color:var(--muted);margin-left:7px;letter-spacing:.08em}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;font-size:16px;transition:transform .15s,border-color .15s}
.ib:hover{border-color:var(--accent);transform:translateY(-1px)}
.ib.wide{width:auto;padding:0 10px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.hero{padding:8px 14px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(124,108,255,.08),transparent)}
.hrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ava{--p:80;--ringc:var(--good);width:62px;height:62px;border-radius:50%;padding:3px;position:relative;flex:none;
  background:conic-gradient(var(--ringc) calc(var(--p)*1%),rgba(255,255,255,.10) 0);transition:--p .6s}
.ava .in{width:100%;height:100%;border-radius:50%;background:linear-gradient(160deg,#2c2e58,#16172f);display:grid;place-items:center;font-size:30px}
.ava .bd{position:absolute;right:-5px;bottom:-5px;width:25px;height:25px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-size:14px}
.ava.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.14)}}
.nameb{min-width:0}
.nameb h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{font-family:var(--f-mono);font-size:10.5px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted);white-space:nowrap}
.tag.age{color:var(--fg);background:rgba(124,108,255,.25)}
.tag.jail{background:var(--bad);color:#fff}
.tag.love{color:#ffb3d6;background:rgba(255,79,163,.16)}
.tag.com{color:var(--accent2);background:rgba(34,211,238,.13)}
.tag.rec{color:var(--heat);background:rgba(255,122,69,.14)}
.cashb{margin-left:auto;text-align:right;flex:none}
.cashb span{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted)}
.cash{font-family:var(--f-mono);font-weight:500;font-size:19px;font-variant-numeric:tabular-nums;color:var(--good);transition:color .3s,text-shadow .3s}
.cash.neg{color:var(--bad)}
.cash.gain{text-shadow:0 0 14px var(--good)}
.cash.loss{text-shadow:0 0 14px var(--bad)}

.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px 12px}
.bar{cursor:pointer}
.bar .lab{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-bottom:3px;white-space:nowrap}
.bar .lab i{font-style:normal;color:var(--fg);font-variant-numeric:tabular-nums}
.trk{height:8px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.fil{height:100%;border-radius:5px;transition:width .7s cubic-bezier(.2,.9,.3,1);position:relative;overflow:hidden}
.fil::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.f-happy{background:linear-gradient(90deg,#fbbf24,#34d399)}
.f-health{background:linear-gradient(90deg,#fb5a6e,#34d399)}
.f-smarts{background:linear-gradient(90deg,#22d3ee,#7c6cff)}
.f-rep{background:linear-gradient(90deg,#7c6cff,#ff4fa3)}
.f-heat{background:linear-gradient(90deg,#fbbf24,#ff3b30)}
.f-guilt{background:linear-gradient(90deg,#8f93b8,#5b4bbd)}
.bar.danger .trk{animation:danger .9s infinite}
@keyframes danger{50%{box-shadow:0 0 10px 1px rgba(251,90,110,.8)}}

#feed{flex:1;min-height:0;overflow-y:auto;padding:8px 14px 14px;display:flex;flex-direction:column;gap:7px;scroll-behavior:smooth}
#feed::-webkit-scrollbar{width:6px}#feed::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.div{align-self:center;margin:14px 0 4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg);padding:3px 12px;border-radius:999px;background:linear-gradient(90deg,rgba(124,108,255,.35),rgba(34,211,238,.25));border:1px solid var(--line)}
.ln{position:relative;padding:9px 12px;border-radius:14px 14px 14px 4px;background:var(--glass2);border:1px solid var(--line);max-width:94%;overflow-wrap:anywhere}
.ln.g{border-color:rgba(52,211,153,.4);background:linear-gradient(180deg,rgba(52,211,153,.10),var(--glass2))}
.ln.b{border-color:rgba(251,90,110,.4);background:linear-gradient(180deg,rgba(251,90,110,.10),var(--glass2))}
.ln.c{border-color:rgba(255,122,69,.45);background:linear-gradient(180deg,rgba(255,122,69,.12),var(--glass2))}
.ln.s{align-self:center;text-align:center;font-style:italic;color:var(--muted);background:none;border-style:dashed}
.ln.new{animation:pop .5s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.96)}100%{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-family:var(--f-mono);font-size:10.5px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted);white-space:nowrap}
.chip.up{color:var(--good);background:rgba(52,211,153,.13)}
.chip.dn{color:var(--bad);background:rgba(251,90,110,.14)}
.chip.nt{color:var(--gold);background:rgba(251,191,36,.13)}

.panel{flex:none;max-height:40%;overflow-y:auto;border-top:1px solid var(--line);background:rgba(10,11,22,.7);padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.act{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--glass);transition:transform .15s,border-color .15s,box-shadow .15s}
.act:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px);box-shadow:0 6px 18px rgba(124,108,255,.18)}
.act:active:not(:disabled){transform:scale(.985)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act .ic{width:38px;height:38px;border-radius:11px;background:rgba(124,108,255,.16);display:grid;place-items:center;font-size:20px}
.act.hot .ic{background:rgba(255,122,69,.18)}
.act.hot{border-color:rgba(255,122,69,.28)}
.act strong{display:block;font-weight:600;font-size:14.5px}
.act .rt{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-align:right;white-space:nowrap}
.rk{padding:2px 8px;border-radius:999px;font-weight:500}
.rk1{color:var(--good);background:rgba(52,211,153,.13)}.rk2{color:var(--gold);background:rgba(251,191,36,.13)}
.rk3{color:var(--heat);background:rgba(255,122,69,.16)}.rk4{color:#fff;background:var(--bad)}
.empty{color:var(--muted);padding:12px 4px;text-align:center}

.dock{flex:none;border-top:1px solid var(--line);background:rgba(10,11,22,.85);padding:8px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:6px}
.tab{flex:1;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--glass);font-family:var(--f-mono);font-size:12px;color:var(--muted);transition:all .15s;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent);background:linear-gradient(180deg,rgba(124,108,255,.3),rgba(124,108,255,.12));box-shadow:0 0 16px rgba(124,108,255,.25)}
.age{position:relative;overflow:hidden;width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--pink));color:#fff;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.01em;box-shadow:0 8px 28px rgba(124,108,255,.4);transition:transform .12s,filter .2s}
.age::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3s infinite}
.age:hover:not(:disabled){filter:brightness(1.1)}
.age:active:not(:disabled){transform:scale(.97)}
.age:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.age small{display:block;font-family:var(--f-mono);font-weight:500;font-size:10.5px;opacity:.85;letter-spacing:.08em;margin-top:1px}

.overlay{position:fixed;inset:0;background:rgba(5,5,12,.7);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.card{position:relative;width:100%;max-width:450px;max-height:100%;overflow-y:auto;background:linear-gradient(180deg,#1b1d3a,#12132a);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 70px rgba(0,0,0,.6),0 0 40px rgba(124,108,255,.18)}
.card.pop{animation:card .38s cubic-bezier(.2,.9,.3,1.2)}
@keyframes card{0%{opacity:0;transform:translateY(30px) scale(.94)}100%{opacity:1;transform:none}}
.card .kick{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2)}
.card .kick span{width:28px;height:28px;border-radius:9px;background:rgba(34,211,238,.13);display:grid;place-items:center;font-size:15px}
.card h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.15;text-wrap:balance}
.card p{margin:0;color:#d5d8f5}
.tm{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.tm i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--bad));border-radius:3px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.opt{position:relative;padding:11px 13px 11px 38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);text-align:left;font-weight:600;transition:transform .12s,border-color .15s,background .15s}
.opt:hover{border-color:var(--accent);background:rgba(124,108,255,.14);transform:translateX(3px)}
.opt:active{transform:scale(.98)}
.opt .k{position:absolute;left:11px;top:11px;width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.opt.pri{background:linear-gradient(135deg,var(--accent),var(--pink));border-color:transparent;color:#fff}
.opt.pri .k{background:rgba(255,255,255,.25);color:#fff}
.opt.code{font-family:var(--f-mono);font-weight:500;font-size:12.5px;white-space:pre-wrap;padding:8px 10px 8px 38px}
.opt .chips{margin-top:5px}
.opt.pri .chip{background:rgba(255,255,255,.2);color:#fff}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sumgrid div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.sumgrid b{display:block;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.sumgrid span{font-size:12px;color:var(--muted)}
.achg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.achg div{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.achg div.lock{opacity:.4;filter:grayscale(1)}
.achg em{font-style:normal;font-size:22px}
.achg b{display:block;font-size:13px}.achg span{font-size:11px;color:var(--muted);line-height:1.25;display:block}
.tomb{text-align:center;font-size:54px;line-height:1;filter:drop-shadow(0 0 18px rgba(124,108,255,.6))}

#toasts{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{max-width:440px;padding:9px 14px;border-radius:12px;background:rgba(20,22,42,.95);border:1px solid var(--line);font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:toast 3.4s both}
.toast.g{border-color:var(--good)}.toast.b{border-color:var(--bad)}.toast.c{border-color:var(--heat)}.toast.gold{border-color:var(--gold);background:linear-gradient(135deg,#3a2f0b,#1b1530)}
@keyframes toast{0%{opacity:0;transform:translateY(-14px) scale(.95)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.fl{position:fixed;z-index:95;pointer-events:none;font-family:var(--f-mono);font-weight:500;font-size:15px;text-shadow:0 2px 8px #000;animation:fl 1.5s ease-out both}
.fl.up{color:var(--good)}.fl.dn{color:var(--bad)}
@keyframes fl{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-38px)}}

.title{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:radial-gradient(800px 500px at 50% 30%,rgba(124,108,255,.28),transparent 65%),rgba(6,6,14,.9);backdrop-filter:blur(6px)}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(54px,14vw,96px);letter-spacing:-.04em;line-height:1;position:relative}
.logo b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo::before,.logo::after{content:attr(data-t);position:absolute;left:0;right:0;top:0;opacity:.0;pointer-events:none}
.logo::before{color:var(--pink);animation:gl1 4s infinite}
.logo::after{color:var(--accent2);animation:gl2 4s infinite}
@keyframes gl1{0%,92%,100%{opacity:0}93%{opacity:.8;transform:translate(-4px,1px);clip-path:inset(10% 0 55% 0)}96%{opacity:.8;transform:translate(3px,-2px);clip-path:inset(60% 0 10% 0)}}
@keyframes gl2{0%,92%,100%{opacity:0}94%{opacity:.8;transform:translate(4px,-1px);clip-path:inset(40% 0 30% 0)}97%{opacity:.8;transform:translate(-3px,2px);clip-path:inset(5% 0 70% 0)}}
.tag2{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.tbtn{min-width:230px;padding:14px 22px;border-radius:14px;font-family:var(--f-display);font-weight:800;font-size:19px;border:1px solid var(--line);background:var(--glass);transition:transform .12s,box-shadow .2s}
.tbtn.pri{background:linear-gradient(135deg,var(--accent),var(--pink));border-color:transparent;color:#fff;box-shadow:0 10px 34px rgba(124,108,255,.45)}
.tbtn:hover{transform:translateY(-2px)}
.tnote{max-width:380px;font-size:12.5px;color:var(--muted)}
.tstat{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

@media (max-width:420px){.hrow{gap:9px}.cash{font-size:16px}.nameb h1{font-size:18px}.bars{gap:8px 9px}.achg{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head><body>
<canvas id="bg"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<canvas id="confetti"></canvas>

<div id="app">
  <header class="top">
    <div class="brand"><b>Com</b>Life<small>#life-sim</small></div>
    <button class="ib" id="achBtn" type="button" aria-label="Achievements">🏆</button>
    <button class="ib" id="sndBtn" type="button" aria-label="Toggle sound">🔊</button>
    <button class="ib wide" id="newBtn" type="button">New life</button>
  </header>
  <section class="hero">
    <div class="hrow">
      <div class="ava" id="ava"><div class="in" id="avaE">👶</div><div class="bd" id="avaB">😄</div></div>
      <div class="nameb"><h1 id="nm"></h1><div class="sub" id="sub"></div></div>
      <div class="cashb"><span>CASH</span><div class="cash" id="cash">$0</div></div>
    </div>
    <div class="bars" id="bars"></div>
  </section>
  <main id="feed" tabindex="0" aria-live="polite"></main>
  <section class="panel" id="panel" hidden></section>
  <nav class="dock">
    <div class="tabs" id="tabs" role="tablist"></div>
    <button class="age" id="ageBtn" type="button"></button>
  </nav>
</div>

<div class="overlay" id="overlay" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<div id="toasts"></div>

<div class="title" id="title">
  <div class="tag2">a life sim</div>
  <div class="logo" data-t="ComLife"><b>Com</b>Life</div>
  <div class="tag2">age up. make choices. live with them.</div>
  <button class="tbtn pri" id="tCont" type="button">Continue life</button>
  <button class="tbtn" id="tNew" type="button">New life</button>
  <div class="tstat" id="tStat"></div>
  <div class="tnote">Every choice has an upside and a downside. Every crime in this game has real victims, and the game keeps count.</div>
</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const chance=p=>Math.random()<p;
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const money=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function tone(f,d,type,v,t0){
  if(muted)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(t0||0);
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.05,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}

function shake(){if(RM)return;document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');}

const CF={p:[],run:false};
function confetti(n,cols){
  if(RM)return;
  cols=cols||['#7c6cff','#22d3ee','#ff4fa3','#fbbf24','#34d399'];
  const x=innerWidth/2,y=innerHeight*.4;
  for(let i=0;i<n;i++)CF.p.push({x,y,vx:rnd(-7,7),vy:rnd(-13,-3),g:.3,r:rnd(3,7),c:pick(cols),a:1,rot:rnd(0,6),vr:rnd(-.3,.3)});
  if(!CF.run){CF.run=true;requestAnimationFrame(cfFrame);}
}
function cfFrame(){
  const cv=$('#confetti'),cx=cv.getContext('2d');
  if(cv.width!==innerWidth||cv.height!==innerHeight){cv.width=innerWidth;cv.height=innerHeight;}
  cx.clearRect(0,0,cv.width,cv.height);
  CF.p=CF.p.filter(p=>p.a>.03&&p.y<cv.height+30);
  CF.p.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.99;p.a-=.008;p.rot+=p.vr;cx.save();cx.globalAlpha=Math.max(p.a,0);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore();});
  if(CF.p.length)requestAnimationFrame(cfFrame);else{CF.run=false;cx.clearRect(0,0,cv.width,cv.height);}
}
function toast(t,k){
  const box=$('#toasts');if(!box)return;
  const d=document.createElement('div');d.className='toast '+(k||'');d.textContent=t;
  box.appendChild(d);
  while(box.children&&box.children.length>3)box.removeChild(box.children[0]);
  setTimeout(()=>{try{d.remove()}catch(e){}},3500);
}
/* animated network background, tinted by heat */
(function(){
  const cv=$('#bg'),cx=cv.getContext('2d');let W=0,H=0,pts=[];
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;const n=Math.min(70,Math.floor(W*H/20000));pts=[];for(let i=0;i<n;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28});}
  function frame(){
    cx.clearRect(0,0,W,H);
    const hue=255-Math.min(HEAT,100)*2.3;
    for(let i=0;i<pts.length;i++){
      const p=pts[i];p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      cx.fillStyle='hsla('+hue+',90%,70%,.55)';cx.beginPath();cx.arc(p.x,p.y,1.6,0,6.3);cx.fill();
      for(let j=i+1;j<pts.length;j++){
        const q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;
        if(d<14000){cx.strokeStyle='hsla('+hue+',90%,70%,'+(.16*(1-d/14000))+')';cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke();}
      }
    }
    if(!RM&&!document.hidden)requestAnimationFrame(frame);else if(!RM)setTimeout(()=>requestAnimationFrame(frame),500);
  }
  size();addEventListener('resize',size);frame();
})();

function tags(str){

function deltaChips(d){
  if(!d||!d.length)return '';
  return '<div class="chips">'+d.map(x=>{
    const k=x[0],v=x[1],good=INV[k]?v<0:v>0;
    const txt=k==='cash'?(v>0?'+':'-')+'$'+Math.abs(v).toLocaleString('en-US'):(v>0?'+':'')+v+' '+LBL[k];
    return '<span class="chip '+(good?'up':'dn')+'">'+esc(txt)+'</span>';
  }).join('')+'</div>';
}

/* ================= modal system ================= */
function queue(ev){evq.push(ev);if(!busy)showNext();}
function Q(kick,title,text,opts,more){queue(Object.assign({kick:kick,title:title,text:text,opts:opts},more||{}));}
function o(label,fn,tg,pri,cls){return {label:label,fn:fn,tg:tg,pri:pri,cls:cls};}
function showNext(){
  clearInterval(timerH);
  const ev=evq.shift();
  if(!ev){busy=false;cur=null;$('#overlay').hidden=true;render();return;}
  busy=true;cur=ev;ev.locked=false;
  const card=$('#card');
  const opts=ev.opts||[{label:'OK',pri:true}];
  ev.opts=opts;
  card.innerHTML=(ev.kick?'<div class="kick"><span>'+kickIcon(ev.kick)+'</span>'+esc(ev.kick)+'</div>':'')+
    '<h2>'+esc(ev.title)+'</h2>'+(ev.text?'<p>'+esc(ev.text)+'</p>':'')+(ev.html||'')+
    (ev.timer?'<div class="tm"><i></i></div>':'')+'<div class="opts"></div>';
  const box=card.querySelector('.opts');
  opts.forEach((op,i)=>{
    const b=document.createElement('button');b.type='button';b.className='opt'+(op.pri?' pri':'')+(op.cls?' '+op.cls:'');
    b.innerHTML='<span class="k">'+(i+1)+'</span>'+esc(op.label)+tags(op.tg);
    b.addEventListener('click',()=>choose(i));
    box.appendChild(b);
  });
  card.classList.remove('pop');void card.offsetWidth;card.classList.add('pop');
  $('#overlay').hidden=false;
  const f=box.querySelector('button');if(f)f.focus();
  if(ev.timer){
    ev.t=ev.timer;const bar=card.querySelector('.tm i');let n=0;
    timerH=setInterval(()=>{
      ev.t-=.1;n++;if(bar)bar.style.width=Math.max(0,ev.t/ev.timer*100)+'%';
      if(ev.t<=3&&n%10===0)sfx('tick');
      if(ev.t<=0){clearInterval(timerH);expire();}
    },100);
  }
}
function expire(){
  if(!cur||cur.locked)return;
  if(cur.onTimeout){cur.locked=true;cur.onTimeout();render();showNext();}
  else choose(cur.def||0);
}
function choose(i){
  if(!cur||cur.locked)return;
  const op=cur.opts[i];if(!op)return;
  cur.locked=true;clearInterval(timerH);sfx('click');
  if(op.fn)op.fn();
  render();
  showNext();
}

  ],{timer:12,def:2});

function sentence(mult,msg,repHit){
  const c=S.crimes,juv=S.age<18;
  const sev=c.dox*.6+c.swat*2+c.scam*.8+c.crypto*2.5+c.ato*3+c.harm*6+(S.server?2:0);
  let yrs=sev*rnd(.7,1.3)*mult;
  if(juv)yrs=Math.min(yrs*.5,4);
  yrs=Math.round(Math.min(yrs,25)*2)/2;
  const hurt=c.harm>0||c.swat>0;
  S.crimes={dox:0,swat:0,scam:0,crypto:0,ato:0,harm:0};
  S.heat=0;S.server=false;S.record++;
  if(repHit)mod({rep:repHit});
  mod({family:-15});
  say(msg,'c');
  if(yrs<1){
    const fine=ri(2000,9000);mod({cash:-fine,happy:-12});
    say('Probation and a '+money(fine)+' fine. A conviction with your real name on it.','b');
  }else{
    S.jail={yrs:yrs,juv:juv};mod({happy:-25});
    if(S.job){say('You lost your job as a '+S.job.n+'.','b');S.job=null;}
    if(S.partner&&chance(.45)){say(S.partner.n+' left. They could not do this.','b');S.partner=null;S.married=false;S.bond.partner=0;}
    say((hurt?'The judge read statements from the people you targeted. ':'')+'You were sentenced to '+yrs+' year'+(yrs===1?'':'s')+' in '+(juv?'juvenile detention':'prison')+'.','b');
    ui.tab='lockup';unlock('lockup');shake();buzz(250);
  }
}
function immediateRaid(){S.heat=100;raid();}
function investigate(){
  if(!pending()||S.jail)return;
  let p=S.heat>=90?.9:clamp((S.heat-25)/130,0,.8);
  if(S.crimes.swat||S.crimes.harm)p+=.08;
  if(chance(p))raid();
}

function doDox(t,cash){
  crime('dox');
  if(chance(.5+S.smarts/250-t.hard)){
    mod({rep:t.rep+ri(0,3),heat:t.heat+ri(0,5),crew:3});
    if(cash)mod({cash:cash});
    say(pick(DOX_OK).replace('{t}',t.n.toLowerCase()),'c');
    followUp('dox');
  }else{
    mod({rep:-3,heat:ri(6,10),happy:-6});
    say(pick(DOX_BAD),'c');
  }
}
function doSwat(t,cash){
  crime('swat');
  if(chance(t.harm)){
    crime('harm');mod({rep:t.rep+8,heat:t.heat+20,happy:-20});
    say(pick(SWAT_HARM),'c');followUp('swatHarm');return;
  }
  if(chance(.15)){say(pick(SWAT_TRACED),'c');immediateRaid();return;}
  if(chance(.55)){
    mod({rep:t.rep,heat:t.heat,happy:-3,crew:3});
    if(cash)mod({cash:cash});
    say(pick(SWAT_OK).replace('{t}',t.n.toLowerCase()),'c');followUp('swat');
  }else{mod({rep:2,heat:8});say(pick(SWAT_FLAG),'c');}
}
function scamCall(cfg){
  if(chance(cfg.p)){
    crime('scam');const c=ri(cfg.lo,cfg.hi);mod({cash:c,heat:cfg.heat,happy:-2,crew:2});
    say(cfg.ok+' You pulled '+money(c)+'. '+pick(SCAM_VICTIMS),'c');followUp('scam');
  }else{mod({heat:4,rep:-1});say(cfg.fail,'n');}
}
function callGame(){
  let q=0,mult=1;
  function finish(){
    const p=clamp(.35+q/100+S.smarts/300,.1,.9);
    if(chance(p)){
      crime('crypto');const c=Math.round(ri(6000,45000)*mult);mod({cash:c,heat:ri(20,28),rep:6,crew:3});
      say('You posed as “CoinVault support” and the target went along. You got '+money(c)+'.','c');
      if(chance(.3)){crime('harm');mod({happy:-10});say('The victim lost their retirement fund. They filed a report.','b');}
      followUp('crypto');
    }else{mod({heat:10,rep:-2});say('The target hung up and called the real exchange.','n');}
  }
  function step3(){Q('On the call','They are almost there','They are hesitating. You can push once more or take what you have.',[
    o('Take the win and end the call',()=>{q+=5;finish();},'+Safer|-Smaller payout'),
    o('Stretch it for more',()=>{q-=10;mult*=1.5;finish();},'+Bigger payout|-Bigger risk')],{timer:8,def:0});}
  function step2(){Q('On the call','They sound suspicious','A long pause. Then: “Wait, is this really CoinVault?”',[
    o('Stay calm and patient',()=>{q+=10;step3();},'+Better odds|~Slower'),
    o('Push harder',()=>{q-=5;mult*=1.2;step3();},'+Bigger payout|-Worse odds'),
    o('Hang up',()=>{mod({heat:2,rep:-1});say('You hung up before it went anywhere.','n');},'+Safe|-No payout')],{timer:8,def:0});}
  Q('Outgoing call','Call as exchange support','Someone picks up. How do you open?',[
    o('Friendly and helpful',()=>{q+=10;step2();},'+Better odds'),
    o('Urgent and serious',()=>{q+=5;mult*=1.3;step2();},'+Bigger payout|-Pushy'),
    o('Confident and fast',()=>{mult*=1.2;step2();},'+Some extra payout'),
    o('Back out',()=>{S.did.crypto=false;},'+No harm done')]);
}

function bounty(){
  const set=BUGS.slice().sort(()=>Math.random()-.5).slice(0,3);let ok=0;
  function round(r){
    if(r>=3)return finishB();
    const p=set[r];
    Q('Bug hunt '+(r+1)+'/3',p.t,'One line is the bug. Click it before the timer runs out.',
      p.l.map((ln,i)=>o(ln,()=>{
        if(i===p.bad){ok++;say('Found it. '+p.why,'g');}
        else say('Wrong line. '+p.why,'n');
        round(r+1);},'',false,'code')),
      {timer:14,onTimeout:()=>{say('Time ran out. '+p.why,'n');round(r+1);}});
  }
  function finishB(){
    if(!ok){mod({happy:-2,smarts:1});say('Every report was rejected. Back to the docs.','b');return;}
    const c=ok*ri(500,3500);S.legit++;
    mod({cash:c,smarts:ok*2,guilt:-ok*4,heat:-3,happy:3+ok*2});
    say('A company paid you '+money(c)+' for reporting '+ok+' security hole'+(ok>1?'s':'')+'.','g');
    unlock('bounty');if(c>=3000)confetti(50);
  }
  round(0);
}

function drawEvents(){
  let elig=E.filter(e=>{
    if(!!e.jail!==!!S.jail)return false;
    if(e.min&&S.age<e.min)return false;
    if(e.max&&S.age>e.max)return false;
    if(e.once&&S.seen[e.id])return false;
    if(S.cool[e.id]&&S.age<S.cool[e.id])return false;
    if(e.when&&!e.when())return false;
    return true;
  });
  const n=chance(.92)?(chance(.4)?2:1):0;
  for(let i=0;i<n&&elig.length;i++){
    let tot=0;elig.forEach(e=>{tot+=e.w||1;});
    let r=Math.random()*tot,e=elig[0];
    for(let j=0;j<elig.length;j++){r-=elig[j].w||1;if(r<=0){e=elig[j];break;}}
    S.seen[e.id]=1;if(e.cd)S.cool[e.id]=S.age+e.cd;
    elig=elig.filter(x=>x!==e);
    e.run();
  }
}

 {id:'retainer',tab:'shop',ic:'⚖️',label:'Put a lawyer on retainer',fx:'+Covers your next case|-$8,000',min:18,hide:()=>S.retainer,lk:()=>S.cash<8000?'Needs $8,000':'',run(){mod({cash:-8000});S.retainer=true;say('You put a lawyer on retainer.','n');}},

 {id:'read',tab:'lockup',ic:'📖',label:'Read in the library',fx:'+Smarts',run(){mod({smarts:ri(3,6)});say('You read all week.','g');}},
 {id:'work',tab:'lockup',ic:'🏃',label:'Work out in the yard',fx:'+Health|-Rough crowd',run(){mod({health:ri(3,6)});say('You trained in the yard.','g');}},
 {id:'quiet',tab:'lockup',ic:'🤫',label:'Keep your head down',fx:'+Happy|+Safe',run(){mod({happy:ri(2,5)});say('You stayed out of trouble.','n');}},
 {id:'writehome',tab:'lockup',ic:'✉️',label:'Write home',fx:'+Family|+Happy',run(){mod({family:ri(4,9),happy:3});say('You wrote a letter home. It took three drafts.','g');}},
 {id:'prisonjob',tab:'lockup',ic:'🧰',label:'Take a prison job',fx:'+Small cash|-Happy',run(){mod({cash:ri(100,400),happy:-2});say('You worked a shift in the laundry for pocket change.','n');}},
 {id:'ged',tab:'lockup',ic:'📝',label:'Study for your GED',fx:'+Smarts|+Happy',hide:()=>S.ged,run(){S.ged=true;mod({smarts:8,happy:4});say('You earned your GED.','g');}},
 {id:'appeal',tab:'lockup',ic:'📜',label:'File an appeal',fx:'~30% to cut a year|-$0 but hope',run(){if(chance(.3)&&S.jail){S.jail.yrs=Math.max(.5,S.jail.yrs-1);mod({happy:5});say('Your appeal worked. A year came off.','g');}else{mod({happy:-3});say('Your appeal was denied.','b');}}},
 {id:'snitch',tab:'lockup',ic:'🐀',label:'Talk to investigators',fx:'+Shorter sentence|-Rep|-Crew',run(){if(S.jail)S.jail.yrs=Math.max(.5,S.jail.yrs-1);mod({rep:-20,happy:-4,crew:-20});say('You gave names. A year came off.','n');}}
];
function lock(a){
  if(a.min&&S.age<a.min)return 'Age '+a.min+'+';
  if(a.need==='discord'&&!S.discord)return 'Join a Discord first';
  if(a.need==='com'&&!S.com)return 'Needs the Com';
  if(a.need==='partner'&&!S.partner)return 'Needs a partner';
  if(a.need==='crime'&&!crimesEver())return 'Nothing to apologize for';
  if(a.rep&&S.rep<a.rep)return 'Rep '+a.rep+'+';
  if(a.lk){const r=a.lk();if(r)return r;}
  return '';
}
function act(a){
  if(busy||!S.alive||S.did[a.id]||lock(a))return;
  S.did[a.id]=true;sfx('click');
  a.run();
  render();
}
function riskLvl(a){return clamp(Math.round((a.risk||2)+S.heat/45-.5),1,4);}
const RKL=['','Low risk','Medium risk','High risk','Extreme risk'];

/* ================= aging ================= */
function scripted(){
  const t={5:'You started kindergarten.',8:'Your family got a computer.',10:'You got your own laptop.',11:'Everyone at school is on Discord now.',13:'Servers start inviting you into private channels.',14:'High school started.',16:'Some people in the servers are already making money.',18:'You graduated. Rent and bills now have your real name on them.',21:'You can legally drink. Nobody in the server cares about that.',30:'Your online friends are mostly strangers who know your old handle.',40:'Midlife. Your knees file a complaint.'};
  if(t[S.age])say(t[S.age],'n');
  if(S.age===65&&S.job){say('You retired from your job as a '+S.job.n+'.','n');S.job=null;}
}
function ageUp(){
  if(busy||!S.alive)return;
  sfx('age');
  const prev={fam:S.did.fam,fri:S.did.fri,par:S.did.par,crime:S.crimeYr};
  S.age++;S.did={};S.crimeYr=false;D=[];
  const av=$('#ava');av.classList.remove('bump');void av.offsetWidth;av.classList.add('bump');
  let decl=S.age<35?(chance(.15)?ri(1,3):0):ri(1,2)+Math.floor((S.age-35)/15);
  S.health=clamp(S.health-decl);
  if(S.happy<=5)S.health=clamp(S.health-3);
  if(S.jail){
    S.inside++;S.jail.yrs-=1;
    say(pick(JAIL_LINES),'n');mod({happy:-ri(1,5),health:-ri(0,2)});
    drawEvents();
    if(S.jail&&S.jail.yrs<=0){
      S.jail=null;S.heat=10;S.rep=Math.floor(S.rep/2);ui.tab='online';
      say('You were released at '+S.age+'. The conviction came with you.','b');
    }
  }else{
    scripted();
    const f=FLAVOR.filter(e=>S.age>=e[0]&&S.age<=e[1]);
    if(f.length&&chance(.3)){const e=pick(f);mod(e[3]);say(e[2],e[4]);}
    if(S.age>=8&&S.age<18)mod({cash:ri(100,400)});
    drawEvents();
    /* relationships drift if ignored */
    if(S.age>=6&&!prev.fam)S.bond.family=clamp(S.bond.family-2);
    if(S.age>=8&&!prev.fri)S.bond.friends=clamp(S.bond.friends-2);
    if(S.partner&&!prev.par)S.bond.partner=clamp(S.bond.partner-4);
    if(S.com)S.bond.crew=clamp(S.bond.crew-2);
    if(S.age>=10&&S.bond.family<20&&chance(.5)){mod({happy:-3});say('You and your family barely talk anymore.','b');}
    if(S.age>=10&&S.bond.friends<15&&chance(.4)){mod({happy:-3});say('Your friends stopped texting. It stings.','b');}
    if(S.partner&&S.bond.partner<=8){say(S.partner.n+' left. You had stopped making time.','b');mod({happy:-10});S.partner=null;S.married=false;S.bond.partner=0;}
    if(S.partner&&S.married&&S.bond.partner>40)mod({happy:2});
    if(S.com&&S.bond.crew<10&&chance(.2)){mod({heat:20,rep:-6});say('Your crew stopped covering for you. Someone talked.','c');}
    if(S.exTarget&&chance(.4)){S.exTarget=false;mod({heat:10,happy:-5});say('Someone you left behind leaked old messages.','c');}
    if(S.age>=18){
      mod({cash:-16000});
      if(S.age<23&&S.bond.family>=40&&S.college)mod({cash:6000});
      if(S.job){mod({cash:S.job.p+(S.college?8000:0)});
        if(chance(.08)){S.job.p=Math.round(S.job.p*1.08);say('You got a small raise at work.','g');}
        else if(chance(.04)){say('You were laid off from your job as a '+S.job.n+'.','b');S.job=null;mod({happy:-8});}}
      if(S.cash<-15000)mod({happy:-4});
    }
    if(S.server)mod({rep:3,heat:6});
    S.heat=clamp(S.heat-8);
    if(!prev.crime&&S.guilt>0)S.guilt=clamp(S.guilt-3);
    if(S.guilt>=60){mod({happy:-4});if(chance(.5))say('You still think about the people you hurt.','b');}
    investigate();
  }
  const dead=S.health<=0||(S.age>68&&chance((S.age-68)*.02))||S.age>=105;
  if(dead)die(S.jail?'in custody':(S.health<=0?'of ill health':'of natural causes'));
  render();
}
function die(cause){
  S.alive=false;S.ended=cause;
  M.lives++;M.best=Math.max(M.best,S.age);saveMeta();
  const c=S.tot,v=c.dox+c.swat+c.scam+c.crypto+c.ato;
  let title,txt;
  if(S.legit>=3&&S.inside<2){title='The Long Way Around';txt='You turned the same skills toward honest work.';}
  else if(S.inside>=10){title='A Long Sentence';txt='Most of your adult life was spent inside.';}
  else if(S.inside>0){title='Doing the Time';txt='Prison and a record shaped what came after.';}
  else if(v>0){title='Never Caught';txt='No one caught you. The people you targeted are still out there.';}
  else{title='An Ordinary Life';txt='The Com never got its hooks in you.';}
  const html='<div class="tomb">🪦</div><div class="sumgrid">'+
   [[S.age,'Age at death'],[money(S.cash),'Cash'],[v,'People targeted'],[c.harm,'People seriously harmed'],[S.inside+' yrs','Time inside'],[S.peakRep,'Peak rep'],[S.bond.family,'Family bond'],[S.partner?S.partner.n:'None','Partner']]
   .map(p=>'<div><b>'+esc(p[0])+'</b><span>'+esc(p[1])+'</span></div>').join('')+'</div>';
  say('You died '+cause+' at '+S.age+'.','s');
  sfx('death');flash('rgba(0,0,0,.8)');
  queue({kick:'The end',title:title,text:S.name+' died '+cause+'. '+txt,html:html,opts:[{label:'Start a new life',pri:true,fn:()=>newLife()}]});
}
function checkAch(){
  if(S.job)unlock('first_job');if(S.college)unlock('diploma');if(S.cash>=100000)unlock('rich');
  if(S.age>=70)unlock('oldtimer');if(S.married)unlock('married');
  if(S.age>=60&&!S.everCom)unlock('ordinary');
}

/* ================= render ================= */
function initBars(){
  $('#bars').innerHTML=BARS.map(b=>'<div class="bar" data-k="'+b[0]+'" title="'+b[2]+'"><div class="lab"><span>'+b[1]+' '+b[2]+'</span><i></i></div><div class="trk"><div class="fil f-'+b[0]+'"></div></div></div>').join('');
}
function avatar(){
  const a=S.age;let e=a<3?'👶':a<13?'🧒':a<18?'🧑‍🎓':a<60?'🧑':'🧓';
  if(!S.alive)e='💀';
  let b=S.happy>70?'😄':S.happy>40?'🙂':S.happy>20?'😞':'😢';
  if(S.heat>=70)b='😰';if(S.jail)b='🔒';if(!S.alive)b='🪦';
  $('#avaE').textContent=e;$('#avaB').textContent=b;
  const av=$('#ava');av.style.setProperty('--p',S.health);
  av.style.setProperty('--ringc',S.health>60?'#34d399':S.health>30?'#fbbf24':'#fb5a6e');
}
function tweenCash(to){
  const el=$('#cash');const from=ui.cashShown==null?to:ui.cashShown;ui.cashShown=to;
  el.className='cash'+(to<0?' neg':'');
  if(from===to||RM){el.textContent=money(to);return;}
  el.classList.add(to>from?'gain':'loss');
  setTimeout(()=>el.classList.remove('gain','loss'),700);
  const t0=Date.now(),dur=650;
  (function step(){
    const k=Math.min(1,(Date.now()-t0)/dur),e=1-Math.pow(1-k,3);
    if(ui.cashShown!==to)return;
    el.textContent=money(from+(to-from)*e);
    if(k<1)requestAnimationFrame(step);else el.textContent=money(to);
  })();
}
function flushF(){
  const list=F.slice(0,8);F=[];
  list.forEach((x,i)=>{
    const k=x[0],v=x[1];
    let target=k==='cash'?$('#cash'):BONDS[k]?$('#ava'):$('.bar[data-k="'+k+'"]');
    if(!target||!target.getBoundingClientRect)return;
    const r=target.getBoundingClientRect(),good=INV[k]?v<0:v>0;
    const d=document.createElement('div');d.className='fl '+(good?'up':'dn');
    d.textContent=k==='cash'?(v>0?'+':'-')+'$'+Math.abs(v).toLocaleString('en-US'):(v>0?'+':'')+v+(BONDS[k]?' '+LBL[k]:'');
    d.style.left=Math.max(6,r.left+r.width/2-24)+'px';d.style.top=(r.top-4)+'px';d.style.animationDelay=(i*.12)+'s';
    document.body.appendChild(d);
    setTimeout(()=>{try{d.remove()}catch(e){}},1900+i*120);
  });
}
const TABINFO={online:['🌐','online'],life:['🎒','life'],people:['👥','people'],shop:['🛒','shop'],lockup:['⛓️','lockup']};
function render(){
  if(!S)return;
  if(S.jail)ui.tab='lockup';else if(ui.tab==='lockup')ui.tab='online';
  document.body.classList.toggle('jail',!!S.jail);
  HEAT=S.heat;
  const vg=$('#vig');vg.style.opacity=S.heat>35?Math.min(1,(S.heat-35)/55):0;vg.classList.toggle('pulse',S.heat>=75);
  tweenCash(S.cash);
  $('#newBtn').textContent=confirmNew?'Sure?':'New life';
  $('#sndBtn').textContent=muted?'🔇':'🔊';
  avatar();
  $('#nm').textContent=S.name;
  $('#sub').innerHTML='<span class="tag age">Age '+S.age+'</span>'+
    (S.job?'<span class="tag">'+esc(S.job.n)+'</span>':'')+
    (S.handle&&S.com?'<span class="tag com">'+esc(S.handle)+'</span>':'')+
    (S.partner?'<span class="tag love">'+(S.married?'💍 ':'💞 ')+esc(S.partner.n)+'</span>':'')+
    (S.record?'<span class="tag rec">Record x'+S.record+'</span>':'')+
    (S.jail?'<span class="tag jail">'+(S.jail.juv?'Juvenile detention':'Prison')+', '+S.jail.yrs+' yr left</span>':'');
  BARS.forEach(b=>{
    const el=$('.bar[data-k="'+b[0]+'"]');if(!el)return;
    const v=S[b[0]];
    el.querySelector('.fil').style.width=v+'%';el.querySelector('i').textContent=Math.round(v);
    el.classList.toggle('danger',(b[0]==='happy'&&v<=15)||(b[0]==='health'&&v<=20)||(b[0]==='heat'&&v>=75)||(b[0]==='guilt'&&v>=80));
  });
  let h='';
  S.log.forEach(g=>{
    h+='<div class="div">Age '+g.age+'</div>';
    g.lines.forEach(l=>{h+='<div class="ln '+l.c+(l.id>ui.seen?' new':'')+'">'+esc(l.t)+deltaChips(l.d)+'</div>';});
  });
  const feed=$('#feed');feed.innerHTML=h;feed.scrollTop=feed.scrollHeight;
  ui.seen=S.seq;
  const tabs=S.jail?['lockup']:['online','life','people','shop'];
  $('#tabs').innerHTML=tabs.map(t=>'<button class="tab" type="button" role="tab" data-tab="'+t+'" aria-selected="'+(ui.tab===t&&ui.open)+'">'+TABINFO[t][0]+' '+TABINFO[t][1]+'</button>').join('');
  const p=$('#panel');p.hidden=!ui.open;
  if(ui.open){
    const items=A.filter(a=>a.tab===ui.tab&&!(a.hide&&a.hide())&&!(a.min&&a.min>S.age+5));
    p.innerHTML=items.length?'':'<div class="empty">Nothing here yet. Age up.</div>';
    items.forEach(a=>{
      const lk=lock(a),done=S.did[a.id];
      const b=document.createElement('button');b.type='button';b.className='act'+(a.hot?' hot':'');b.disabled=!!(lk||done);
      let rt=lk?esc(lk):(done?'Done this year':'');
      if(!lk&&!done&&a.hot){const r=riskLvl(a);rt='<span class="rk rk'+r+'">'+RKL[r]+'</span>';}
      b.innerHTML='<span class="ic">'+a.ic+'</span><span class="tx"><strong>'+esc(a.label)+'</strong>'+tags(a.fx)+'</span><span class="rt">'+rt+'</span>';
      b.addEventListener('click',()=>act(a));
      p.appendChild(b);
    });
  }
  const ab=$('#ageBtn');ab.disabled=busy||!S.alive;
  ab.innerHTML=(S.jail?'Serve another year':'Age up')+'<small>'+(S.alive?'YEAR '+(S.age+1)+' →':'GAME OVER')+'</small>';
  try{localStorage.setItem(SAVE,JSON.stringify(S));}catch(e){}
  flushF();
  checkAch();
}

/* ================= boot ================= */
function intro(){
  Q('Welcome','A life sim about the Com','You start as a baby and age up one year at a time. Events ask you to reply, and the older you get, the more the scene opens up. Every choice has green upsides and red downsides, and the people on the other end of the bad ones are real. Use the tabs to act on your own.',[{label:'Start life',pri:true}]);
}
function newLife(){S=blank();evq=[];busy=false;cur=null;clearInterval(timerH);D=[];F=[];ui={tab:'online',open:true,seen:0,cashShown:0};confirmNew=false;$('#overlay').hidden=true;say('You were born. Your parents named you '+S.name+'.','n');render();intro();}
function achModal(){
  const html='<div class="achg">'+ACH.map(a=>'<div class="'+(M.ach[a.id]?'':'lock')+'"><em>'+a.ic+'</em><p style="margin:0"><b>'+esc(a.n)+'</b><span>'+esc(a.d)+'</span></p></div>').join('')+'</div>';
  if(busy)return;
  Q('Achievements','Trophies','Unlocked '+Object.keys(M.ach).length+' of '+ACH.length+'. Lives lived: '+M.lives+'. Oldest age: '+M.best+'.',[{label:'Close',pri:true}],{html:html});
}
$('#ageBtn').addEventListener('click',ageUp);
$('#achBtn').addEventListener('click',achModal);
$('#sndBtn').addEventListener('click',()=>{muted=!muted;try{localStorage.setItem(MUTE,muted?'1':'0')}catch(e){}$('#sndBtn').textContent=muted?'🔇':'🔊';sfx('click');});
$('#bars').addEventListener('click',e=>{
  const b=e.target.closest('.bar');if(!b||busy)return;
  const m={Happy:'How you feel. At zero your health starts dropping.',Health:'At zero you die.',Smarts:'Helps crimes succeed and unlocks legit paths.',Rep:'Clout in the Com. Unlocks bigger crimes.',Heat:'Law-enforcement attention. High heat means raids and arrests.',Guilt:'What the choices cost you inside. High guilt drains your happiness and wakes you at night.'};
  const k=b.getAttribute('title');Q('Stat',k,m[k]||'',[{label:'OK',pri:true}]);
});
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  const t=b.getAttribute('data-tab');
  ui.open=(ui.tab===t&&ui.open)?false:true;ui.tab=t;sfx('click');render();
});
$('#newBtn').addEventListener('click',()=>{
  if(!confirmNew){confirmNew=true;render();setTimeout(()=>{confirmNew=false;render();},3000);}
  else newLife();
});
addEventListener('keydown',e=>{
  if(!$('#overlay').hidden&&cur){const n=parseInt(e.key,10);if(n>=1&&n<=9)choose(n-1);return;}
  if($('#title')&&!$('#title').hidden)return;
  if(e.key==='Enter'&&S&&document.activeElement===document.body)ageUp();
});
$('#tNew').addEventListener('click',()=>{$('#title').hidden=true;newLife();});
$('#tCont').addEventListener('click',()=>{$('#title').hidden=true;render();});
function boot(){
  initBars();loadMeta();
  let loaded=false;
  try{const raw=localStorage.getItem(SAVE);if(raw){const ld=JSON.parse(raw);if(ld&&ld.name&&ld.log&&ld.crimes&&ld.seen&&ld.bond){S=ld;loaded=true;ui.seen=S.seq||0;}}}catch(e){}
  $('#tCont').hidden=!(loaded&&S.alive);
  $('#tStat').textContent=M.lives?('Lives lived: '+M.lives+'   Oldest: '+M.best+'   Trophies: '+Object.keys(M.ach).length+'/'+ACH.length):'';
  if(!loaded||!S.alive)S=null;
}
boot();
window.__CL={ageUp,choose,newLife,act,A,lock,state:()=>S,busy:()=>busy,cur:()=>cur,render};
})();
</script>
</body></html>
